<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Заявки на уроки | Marmalade</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Rubik+Bubbles&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/css/admin-requests.css}" /> <!-- новый CSS -->
</head>
<body>
<div class="container">
  <h1 class="page-title">Заявки на уроки</h1>

  <div th:if="${requests == null or #lists.isEmpty(requests)}" class="no-requests">
    <p>Заявок нет.</p>
  </div>

  <table th:if="${requests != null and not #lists.isEmpty(requests)}" class="requests-table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Студент</th>
      <th>Преподаватель</th>
      <th>Дата</th>
      <th>Статус</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}" th:if="${r.status == 'PENDING'}">
<!--    <tr th:each="r : ${requests}">-->
      <td th:text="${r.id}">1</td>
      <td>
        <div class="student-info" th:text="${r.studentUsername}">username</div>
        <div class="student-info" th:text="${r.studentName}">Имя</div>
      </td>
      <td th:text="${r.teacher.fullName}">Teacher</td>
      <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm') : '—'}">date</td>
      <td class="status" th:text="${r.status}">PENDING</td>
      <td>
        <form th:action="@{/admin/requests/{id}/approve(id=${r.id})}" method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn approve">Одобрить</button>
        </form>
        <form th:action="@{/admin/requests/{id}/reject(id=${r.id})}" method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn reject">Отклонить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>


</div>
<a th:href="@{/teachers}" class="btn">Открыть каталог 👩‍🏫</a>

</body>
</html>
