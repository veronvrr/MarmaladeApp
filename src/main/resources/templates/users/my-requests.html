
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Мои заявки | Marmalade</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Rubik+Bubbles&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/css/my-requests.css}" />
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="container">
  <h1 class="page-title">Мои заявки</h1>

  <!-- Если заявок нет -->
  <div th:if="${requests == null or #lists.isEmpty(requests)}" class="no-requests">
    <p>У вас пока нет заявок.</p>
  </div>

  <!-- Если заявки есть -->
  <table th:if="${requests != null and not #lists.isEmpty(requests)}" class="requests-table">
    <thead>
    <tr>
      <th>#</th>
      <th>Преподаватель</th>
      <th>Дата</th>
      <th>Статус</th>
      <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r,iter : ${requests}">
      <td th:text="${iter.count}">1</td>
      <td th:text="${r.teacher.fullName}">Имя преподавателя</td>
      <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm') : '—'}">дата</td>
      <td th:text="${r.status}">PENDING</td>
      <td>
        <form th:action="@{/my/requests/{id}/cancel(id=${r.id})}" method="post"
              onsubmit="return confirm('Отменить заявку?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn cancel">Отменить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<a th:href="@{/teachers}" class="btn">Открыть каталог</a>
</body>
</html>
