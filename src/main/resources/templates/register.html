                <form class="register-form" th:action="@{/register}" th:object="${userForm}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="field floating">
                        <input id="username" th:field="*{username}" type="text" placeholder=" " autocomplete="username" />
                        <label for="username">Имя</label>
                        <!-- вывод ошибки для username -->
                        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></div>
                    </div>

                    <div class="field floating password-field">
                        <input id="password" th:field="*{password}" type="password" placeholder=" " autocomplete="new-password" />
                        <label for="password">Пароль</label>
                        <button type="button" class="pw-toggle" aria-label="Показать пароль">🙈</button>
                        <!-- вывод ошибки для password -->
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
                    </div>

                    <div class="select-wrap">
                        <div class="select-with-note">
                            <select id="preferredLanguage" th:field="*{preferredLanguage}">
                                <option value="" disabled selected>Язык</option>
                                <option value="en">Английский</option>
                            </select>
                            <div class="select-note">Новые языки будут добавлены совсем скоро!</div>
                        </div>

                        <div class="select-with-note">
                            <select id="level" th:field="*{level}">
                                <option value="" disabled selected>Уровень</option>
                                <option value="A1">A1</option>
                                <option value="A2">A2</option>
                                <option value="B1">B1</option>
                                <option value="B2">B2</option>
                                <option value="C1">C1</option>
                            </select>
                        </div>
                    </div>

                    <div class="field action">
                        <button type="submit" class="btn-primary">Создать аккаунт</button>
                    </div>

                    <!-- глобальная ошибка (например, логин уже существует) -->
                    <div th:if="${error}" class="error" th:text="${error}"></div>
                </form>

            </div>
