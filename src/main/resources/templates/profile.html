<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Профиль — Marmalade</title>
    <link rel="stylesheet" th:href="@{/css/profile.css}" href="/css/profile.css"/>
</head>
<body>
<div class="page">
    <!-- левая колонка (sidebar) можно переиспользовать из dashboard -->
    <aside class="sidebar-wrap">
        <header class="app-header">
            <div class="app-name-wrap">
                <img th:src="@{/images/logo-small.png}" src="/images/logo-small.png" alt="logo" class="logo"/>
                <div class="app-name">Marmalade</div>
            </div>
        </header>

        <nav class="sidebar">
            <ul class="sidebar-list">
                <li class="sidebar-item" data-tab="learning"><svg class="icon" ...></svg><span>Обучение</span></li>
                <li class="sidebar-item" data-tab="tutors"><svg class="icon" ...></svg><span>Репетиторы</span></li>
                <li class="sidebar-item active" data-tab="profile"><svg class="icon" ...></svg><span>Профиль</span></li>
            </ul>
        </nav>
    </aside>

    <main class="content-wrap">
        <section class="profile-section">
            <!-- header: иконка профиля + логин (username) -->
            <div class="profile-header">
                <div class="profile-header-right">
                    <div class="user-login" th:text="${user.username}">username</div>
                    <img class="profile-icon" th:src="@{/images/profile-icon.png}" src="/images/profile-icon.png" alt="profile icon"/>
                </div>
            </div>

            <!-- главный блок -->
            <div class="profile-card-large">
                <h1 class="profile-welcome">Привет, <span th:text="${user.fullName != null && user.fullName != '' ? user.fullName : user.username}">Имя_пользователя</span>!</h1>
                <p class="profile-sub">Хочешь провести свой день продуктивно и увлекательно с Marmalade?</p>

                <div class="profile-meta">
                    <div><strong>Язык:</strong> <span th:text="${user.preferredLanguage != null ? user.preferredLanguage : '—'}">Английский</span></div>
                    <div><strong>Уровень:</strong> <span th:text="${user.level != null ? user.level : '—'}">A1</span></div>
                </div>

                <div class="profile-actions">
                    <a th:href="@{/profile/edit}" class="btn">Редактировать</a>

                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn secondary" type="submit">Выйти</button>
                    </form>
                </div>
            </div>

        </section>
    </main>
</div>
</body>
</html>
