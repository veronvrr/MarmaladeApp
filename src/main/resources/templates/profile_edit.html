
<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Редактирование профиля — Marmalade</title>

    <link rel="stylesheet" th:href="@{/css/profile.css}" href="/css/profile.css"/>
</head>
<body>

<main class="profile-page">
    <div class="container">
        <h2 class="page-title">Профиль</h2>

        <div class="profile-grid">

            <!-- ---- Верхняя часть профиля (только аватар + логин) ---- -->
            <aside class="profile-card">
                <div class="profile-top avatar-row">
                    <!-- Аватар -->
                    <div class="avatar-wrap">
                        <img th:if="${user?.avatarFilename != null}"
                             th:src="@{'/avatars/' + ${user.avatarFilename}}"
                             alt="avatar" class="avatar-img" />
                        <div th:if="${user?.avatarFilename == null}" class="avatar-fallback"
                             th:text="${user.fullName != null and user.fullName != '' ? user.fullName.substring(0,1).toUpperCase() : (user.username != null ? user.username.substring(0,1).toUpperCase() : 'M')}">
                            M
                        </div>
                    </div>

                    <!-- Рядом: логин (и можно добавить email/другие данные) -->
                    <div class="profile-login-block">
                        <div class="login-label">Логин</div>
                        <div class="login-value" th:text="${user?.username}">username</div>
                    </div>
                </div>

                <!-- Ниже: выбранный язык и уровень (оставляем) -->
                <div class="profile-bottom">
                    <div><strong>Выбранный язык:</strong> <span th:text="${user?.preferredLanguage}">English</span></div>
                    <div><strong>Уровень:</strong> <span th:text="${user?.level}">A1</span></div>
                </div>
            </aside>

            <!-- ---- Форма загрузки аватара (встраиваем прямо рядом с блоком редактирования или внутри правой части формы) ---- -->
            <form th:action="@{/profile/avatar}" action="/profile/avatar" method="post" enctype="multipart/form-data" class="avatar-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="file-label">
                    <input type="file" name="avatar" accept="image/png,image/jpeg" />
                    Выбрать файл
                </label>

                <button type="submit" class="save-avatar">Сохранить аватар</button>

                <p class="hint">PNG/JPG, рекомендованный квадратный размер, до 5 MB.</p>
            </form>

            <!-- Блок справа: форма редактирования -->
            <section class="edit-form-wrap">
                <form th:action="@{/profile/edit}" th:object="${user}" method="post" id="profileForm" class="profile-form" novalidate>
                    <!-- CSRF -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Full name -->
                    <label class="field">
                        <span class="label-text">Имя</span>
                        <input type="text" th:field="*{fullName}" placeholder="Введите имя (отобразится в профиле)" maxlength="80" />
                        <small class="hint">Отображаемое имя, можно оставить пустым.</small>
                    </label>

                    <!-- Username (read-only) -->
                    <label class="field">
                        <span class="label-text">Логин (для входа)</span>
                        <input type="text" th:value="${user.username}" readonly />
                    </label>

                    <!-- Preferred language -->
                    <label class="field inline-row">
                        <span class="label-text">Язык</span>
                        <select th:field="*{preferredLanguage}" >
                            <option th:value="en" th:text="'Английский'">Английский</option>
                        </select>
                    </label>

                    <!-- Level -->
                    <label class="field inline-row">
                        <span class="label-text">Уровень</span>
                        <select th:field="*{level}">
                            <option th:value="A1">A1</option>
                            <option th:value="A2">A2</option>
                            <option th:value="B1">B1</option>
                            <option th:value="B2">B2</option>
                            <option th:value="C1">C1</option>
                        </select>
                    </label>

                    <!-- Change password (optional) -->
                    <label class="field password-field">
                        <span class="label-text">Новый пароль (если хотите сменить)</span>
                        <div class="pw-row">
                            <input id="newPassword" name="password" type="password" placeholder="Новый пароль" minlength="6" />
                            <button type="button" class="pw-toggle" aria-label="Показать пароль">🙈</button>
                        </div>
                        <div class="pw-meter" aria-hidden="true"><span class="pw-bar"></span></div>
                        <small class="hint">Пароль минимум 6 символов.</small>
                    </label>

                    <!-- Buttons -->
                    <div class="form-actions">
                        <button type="submit" class="btn save" id="saveBtn"><span class="btn-text">Сохранить</span><span class="spinner" aria-hidden="true"></span></button>
                        <a th:href="@{/dashboard?tab=profile}" class="btn cancel">Отмена</a>
                    </div>

                    <!-- flash message area -->
                    <div id="flash" role="status" aria-live="polite" class="flash" th:if="${msg != null}" th:text="${msg}"></div>
                </form>
            </section>
        </div>
    </div>
</main>

<script th:src="@{/js/profile.js}" src="/js/profile.js"></script>
</body>
</html>
